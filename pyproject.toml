[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-cross-exam"
dynamic = ["version"]
description = "Audit MCP servers by cross-examining them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samir Musali", email = "samir.musali@gmail.com" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "audit",
  "testing",
  "ci",
  "agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<2.4",
  "mcp-types>=2.3,<2.4",
  "uvicorn>=0.34,<1",
  "httpx2>=2.10,<3",
  "anyio>=4.6,<5",
  "pydantic>=2.11,<3",
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<0.2",
  "typer>=0.12,<1",
  "rich>=13,<16",
  "jinja2>=3.1,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-socket>=0.8,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
  "mypy>=2,<3",
  "pre-commit>=4,<5",
  "build>=1,<2",
  "twine>=7,<8",
  "pip-audit>=2.9,<3",
  "types-jsonschema>=4.23,<5",
  "import-linter>=2.1,<3",
  "hypothesis>=6.140,<7",
  "deptry>=0.23,<1",
]

[project.scripts]
mcp-cross-exam = "mcp_cross_exam.cli:main"

[project.urls]
Homepage = "https://github.com/smusali/mcp-cross-exam"
Repository = "https://github.com/smusali/mcp-cross-exam"
Issues = "https://github.com/smusali/mcp-cross-exam/issues"
Changelog = "https://github.com/smusali/mcp-cross-exam/blob/main/docs/CHANGELOG.md"
Documentation = "https://github.com/smusali/mcp-cross-exam/blob/main/docs/USAGE.md"

[tool.hatch.version]
path = "src/mcp_cross_exam/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cross_exam"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/mcp_cross_exam",
  "tests",
  "schemas",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "PT", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S", "PT011", "PT012"]
"tools/**" = ["S"]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--strict-markers",
  "--strict-config",
  "--disable-socket",
  "--allow-unix-socket",
  "--allow-hosts=127.0.0.1,::1",
  "--cov=mcp_cross_exam",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
filterwarnings = ["error", "ignore::ResourceWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
implicit_reexport = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src/mcp_cross_exam", "tests", "tools"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rfc8785"]
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["mcp_cross_exam"]

[tool.coverage.run]
source = ["mcp_cross_exam"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_packages = ["mcp_cross_exam"]

[[tool.importlinter.contracts]]
name = "Audit code uses the transport interface"
type = "forbidden"
source_modules = ["mcp_cross_exam"]
forbidden_modules = [
  "mcp_cross_exam.transport.stdio",
  "mcp_cross_exam.transport.http",
]
ignore_imports = [
  "mcp_cross_exam.cli.session -> mcp_cross_exam.transport.stdio",
  "mcp_cross_exam.cli.session -> mcp_cross_exam.transport.http",
]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
  "mcp_cross_exam.cli",
  "mcp_cross_exam.runner | mcp_cross_exam.report | mcp_cross_exam.fixture | mcp_cross_exam.config",
  "mcp_cross_exam.probes",
  "mcp_cross_exam.evidence",
  "mcp_cross_exam.transport | mcp_cross_exam.findings | mcp_cross_exam.schema_audit",
  "mcp_cross_exam.types | mcp_cross_exam.guard | mcp_cross_exam.exit_codes",
]

[[tool.importlinter.contracts]]
name = "Fixture stays off the schema auditor"
type = "forbidden"
source_modules = ["mcp_cross_exam.fixture"]
forbidden_modules = [
  "mcp_cross_exam.schema_audit",
  "mcp_cross_exam.probes",
]

[[tool.importlinter.contracts]]
name = "Config stays off the transport"
type = "forbidden"
source_modules = ["mcp_cross_exam.config"]
forbidden_modules = ["mcp_cross_exam.transport"]
